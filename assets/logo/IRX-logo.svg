<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="irGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Badge -->
  <rect x="20" y="20" width="80" height="80" rx="16" fill="url(#irGrad)" />
  
  <!-- Waveform / Carrier Glyphs inside Emblem -->
  <path d="M 40 60 L 46 60 L 50 38 L 56 82 L 62 44 L 68 76 L 72 60 L 80 60" 
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Brand Typography -->
  <text x="120" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="52" font-weight="900" letter-spacing="-1.5" fill="url(#textGrad)">IRX</text>
        
  <!-- Subtitle Tagline -->
  <text x="124" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" font-weight="600" letter-spacing="3" fill="#64748B">UNIVERSAL IR SYSTEM</text>
</svg>
